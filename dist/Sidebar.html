<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 13px; color: #202124; margin: 0; padding: 12px; }
  .muted { color: #5f6368; font-size: 12px; }
  .progress { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .input { background: #f8f9fa; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .input .name { font-size: 15px; font-weight: bold; word-break: break-all; }
  .input a { color: #1a73e8; text-decoration: none; }
  .cand { display: block; border: 1px solid #dadce0; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
  .cand:hover { border-color: #1a73e8; }
  .cand.selected { border-color: #1a73e8; background: #e8f0fe; }
  .cand input { margin-right: 6px; }
  .cand .title { font-weight: bold; }
  .score { float: right; font-weight: bold; color: #188038; }
  .score.mid { color: #e37400; }
  .score.low { color: #c5221f; }
  .reasons { font-size: 11px; color: #5f6368; margin-top: 3px; }
  .closed { background: #fce8e6; color: #c5221f; border-radius: 4px; padding: 0 4px; font-size: 11px; margin-left: 4px; }
  .actions { display: flex; gap: 6px; margin: 10px 0; }
  button { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #dadce0; background: #fff; cursor: pointer; font-size: 13px; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button:disabled { opacity: .5; cursor: default; }
  .manual { display: flex; gap: 6px; margin-top: 6px; }
  .manual input { flex: 2; padding: 6px; border: 1px solid #dadce0; border-radius: 6px; }
  .manual button { flex: 1; }
  .msg { margin-top: 8px; font-size: 12px; }
  .msg.error { color: #c5221f; }
  .empty { text-align: center; padding: 40px 0; color: #5f6368; }
  details { margin-top: 12px; }
  .filters { display: flex; gap: 6px; margin-bottom: 6px; }
  .filters input, .filters select { padding: 6px; border: 1px solid #dadce0; border-radius: 6px; font-size: 12px; min-width: 0; }
  .filters input { flex: 2; }
  .filters select { flex: 1; }
  .bar { position: sticky; bottom: 0; background: #fff; padding-top: 6px; border-top: 1px solid #dadce0; }
  .notice { margin-top: 16px; font-size: 10px; color: #80868b; }
</style>
</head>
<body>
<div id="app"><div class="empty">読み込み中…</div></div>
<div class="notice">このサービスは、国税庁法人番号システムのWeb-API機能を利用して取得した情報をもとに作成しているが、サービスの内容は国税庁によって保証されたものではない。</div>
<script>
  var PREF_RE = /^(北海道|東京都|京都府|大阪府|.{2,3}県)/;
  var state = { sheetName: '', items: [], index: 0, selected: null, manual: null, busy: false, query: '', pref: '' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[\x26\x3c\x3e\x22\x27]/g, function (c) {
      return '\x26#' + c.charCodeAt(0) + ';';
    });
  }

  function load() {
    google.script.run.withSuccessHandler(function (res) {
      try {
        state.sheetName = res.sheetName;
        state.items = res.items;
        state.index = 0;
        reset();
        render();
      } catch (e) {
        showError(e);
      }
    }).withFailureHandler(showError).getReviewItems();
  }

  function reset() {
    state.selected = null;
    state.manual = null;
    state.query = '';
    state.pref = '';
  }

  function current() { return state.items[state.index]; }

  function allCandidates() {
    var list = current().candidates.slice();
    if (state.manual) list.unshift(state.manual);
    return list;
  }

  function prefOf(address) {
    var m = String(address || '').match(PREF_RE);
    return m ? m[1] : '';
  }

  function normalize(s) {
    return String(s || '').normalize('NFKC').toLowerCase().replace(/\s/g, '');
  }

  function visibleCandidates() {
    var q = normalize(state.query);
    return allCandidates().filter(function (c) {
      if (state.manual && c === state.manual) return true;
      if (state.pref && prefOf(c.address) !== state.pref) return false;
      return !q || normalize(c.name + c.address + c.corporateNumber).indexOf(q) >= 0;
    });
  }

  function selectedCandidate() {
    var list = allCandidates();
    for (var i = 0; i < list.length; i++) {
      if (list[i].corporateNumber === state.selected) return list[i];
    }
    return null;
  }

  function render() {
    var app = document.getElementById('app');
    if (!state.items.length) {
      app.innerHTML = '\x3cdiv class="empty">🎉 要確認の行はありません\x3cbr>\x3cbr>\x3cbutton onclick="load()">再読み込み\x3c/button>\x3c/div>';
      return;
    }
    var item = current();
    var html = '';
    html += '\x3cdiv class="progress">\x3cspan>\x3cb>' + (state.index + 1) + '\x3c/b> / ' + state.items.length + '件\x3c/span>' +
      '\x3cspan class="muted">' + esc(state.sheetName) + ' ' + item.row + '行目\x3c/span>\x3c/div>';
    html += '\x3cdiv class="input">\x3cdiv class="name">' + esc(item.inputName) + '\x3c/div>';
    if (item.address) html += '\x3cdiv class="muted">住所: ' + esc(item.address) + '\x3c/div>';
    if (item.url) html += '\x3cdiv class="muted">\x3ca href="' + esc(/^https?:/i.test(item.url) ? item.url : 'https://' + item.url) + '" target="_blank">HPを開く ↗\x3c/a>\x3c/div>';
    html += '\x3cdiv class="muted">\x3ca href="https://www.google.com/search?q=' + encodeURIComponent(item.inputName + ' 会社概要') + '" target="_blank">Googleで調べる ↗\x3c/a>\x3c/div>\x3c/div>';
    if (item.stale) html += '\x3cdiv class="msg error">候補データが見つかりません。この行を「やり直す」で再判定してください。\x3c/div>';

    var prefs = [];
    item.candidates.forEach(function (c) {
      var p = prefOf(c.address);
      if (p && prefs.indexOf(p) < 0) prefs.push(p);
    });
    html += '\x3cdiv id="filters" class="filters">\x3c/div>\x3cdiv id="count" class="muted">\x3c/div>\x3cdiv id="list">\x3c/div>';
    html += '\x3cdetails>\x3csummary class="muted">候補にない場合: 法人番号を直接入力\x3c/summary>' +
      '\x3cdiv class="manual">\x3cinput id="num" placeholder="13桁の法人番号">\x3cbutton onclick="lookup()">検索\x3c/button>\x3c/div>\x3c/details>';
    html += '\x3cdiv class="bar">\x3clabel class="muted">\x3cinput type="checkbox" id="remember" checked> この選択を覚えて、次回から自動で確定する\x3c/label>' +
      '\x3cdiv class="actions">\x3cbutton class="primary" id="ok" onclick="confirmSel()">確定\x3c/button>' +
      '\x3cbutton id="ng" onclick="noMatch()">該当なし\x3c/button>\x3c/div>' +
      '\x3cdiv class="actions">\x3cbutton onclick="move(-1)"' + (state.index === 0 ? ' disabled' : '') + '>← 前へ\x3c/button>' +
      '\x3cbutton onclick="move(1)"' + (state.index >= state.items.length - 1 ? ' disabled' : '') + '>スキップ →\x3c/button>\x3c/div>' +
      '\x3cdiv id="msg" class="msg">\x3c/div>\x3c/div>';
    app.innerHTML = html;
    if (item.candidates.length > 5) buildFilters(prefs);
    renderList();
    google.script.run.focusRow(state.sheetName, item.row);
  }

  // script 内の文字列に select/option のタグを書くと HtmlService が「形式が正しくない HTML」で弾いたため DOM で組み立てる
  function buildFilters(prefs) {
    var box = document.getElementById('filters');
    var q = document.createElement('input');
    q.placeholder = '社名・住所で絞り込み';
    q.addEventListener('input', function () { state.query = q.value; renderList(); });
    var sel = document.createElement('select');
    sel.add(new Option('全都道府県', ''));
    prefs.forEach(function (p) { sel.add(new Option(p, p)); });
    sel.addEventListener('change', function () { state.pref = sel.value; renderList(); });
    box.appendChild(q);
    box.appendChild(sel);
  }

  function renderList() {
    var list = visibleCandidates();
    var total = allCandidates().length;
    document.getElementById('count').textContent = list.length === total ? '候補 ' + total + '件' : '候補 ' + total + '件中 ' + list.length + '件を表示';
    document.getElementById('list').innerHTML = list.map(function (c) {
      var cls = c.score === '' ? '' : c.score >= 80 ? '' : c.score >= 50 ? 'mid' : 'low';
      var on = state.selected === c.corporateNumber;
      return '\x3clabel class="cand' + (on ? ' selected' : '') + '" data-num="' + esc(c.corporateNumber) + '">' +
        (c.score === '' ? '' : '\x3cspan class="score ' + cls + '">' + c.score + '%\x3c/span>') +
        '\x3cinput type="radio" name="c"' + (on ? ' checked' : '') + '>' +
        '\x3cspan class="title">' + esc(c.name) + '\x3c/span>' + (c.closed ? '\x3cspan class="closed">閉鎖\x3c/span>' : '') +
        '\x3cdiv class="muted">' + esc(c.address) + '\x3c/div>' +
        '\x3cdiv class="muted">法人番号 ' + esc(c.corporateNumber) + '\x3c/div>' +
        '\x3cdiv class="reasons">' + esc((c.reasons || []).join(' / ')) + '\x3c/div>\x3c/label>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#list .cand'), function (el) {
      el.addEventListener('click', function () { pick(el.getAttribute('data-num')); });
    });
    updateButtons();
  }

  function updateButtons() {
    document.getElementById('ok').disabled = state.busy || !selectedCandidate();
    document.getElementById('ng').disabled = state.busy;
  }

  function pick(num) {
    state.selected = num;
    renderList();
  }

  function move(d) {
    state.index = Math.max(0, Math.min(state.items.length - 1, state.index + d));
    reset();
    render();
  }

  function done() {
    state.items.splice(state.index, 1);
    if (state.index >= state.items.length) state.index = Math.max(0, state.items.length - 1);
    state.busy = false;
    reset();
    render();
  }

  function confirmSel() {
    var item = current();
    var c = selectedCandidate();
    var remember = document.getElementById('remember').checked;
    state.busy = true;
    updateButtons();
    google.script.run.withSuccessHandler(done).withFailureHandler(showError)
      .confirmCandidate(state.sheetName, item.row, item.inputName, c, remember);
  }

  function noMatch() {
    var item = current();
    state.busy = true;
    updateButtons();
    google.script.run.withSuccessHandler(done).withFailureHandler(showError)
      .markNoMatch(state.sheetName, item.row, item.inputName);
  }

  function lookup() {
    var num = document.getElementById('num').value;
    google.script.run.withSuccessHandler(function (c) {
      state.manual = c;
      state.selected = c.corporateNumber;
      renderList();
    }).withFailureHandler(showError).lookupNumberForReview(num);
  }

  function showError(e) {
    state.busy = false;
    var el = document.getElementById('msg');
    if (!el) {
      document.getElementById('app').innerHTML = '\x3cdiv class="msg error">' + esc(e.message || e) + '\x3c/div>';
      return;
    }
    updateButtons();
    el.className = 'msg error';
    el.textContent = e.message || String(e);
  }

  load();
</script>
</body>
</html>
